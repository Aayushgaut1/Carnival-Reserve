    // =========================================================================
    // 3D REALISTIC WEBGL OPENING PAGE (THREE.JS)
    // =========================================================================
    function ThreeDOpeningPage({ onEnterApp }) {
      const mountRef = useRef(null);
      const [isEntering, setIsEntering] = useState(false);

      useEffect(() => {
        const container = mountRef.current;
        if (!container) return;

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x080605, 0.002);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 45;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const ringGeo = new THREE.TorusGeometry(12, 1.2, 32, 100);
        const ringMat = new THREE.MeshStandardMaterial({
          color: 0xFF6A00,
          emissive: 0xD97706,
          emissiveIntensity: 0.8,
          metalness: 0.9,
          roughness: 0.2,
          wireframe: false,
        });
        const portalRing = new THREE.Mesh(ringGeo, ringMat);
        scene.add(portalRing);

        const innerRingGeo = new THREE.TorusGeometry(8, 0.4, 24, 80);
        const innerRingMat = new THREE.MeshBasicMaterial({
          color: 0xFFD21F,
          wireframe: true,
        });
        const innerRing = new THREE.Mesh(innerRingGeo, innerRingMat);
        scene.add(innerRing);

        const particleCount = 1800;
        const particleGeo = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);

        const colorPalette = [
          new THREE.Color(0xFF6A00),
          new THREE.Color(0xFFD21F),
          new THREE.Color(0xFF8A1F),
          new THREE.Color(0xFFFFFF),
        ];

        for (let i = 0; i < particleCount; i++) {
          const r = 20 + Math.random() * 60;
          const theta = Math.random() * Math.PI * 2;
          const phi = (Math.random() - 0.5) * Math.PI;

          positions[i * 3] = r * Math.sin(theta) * Math.cos(phi);
          positions[i * 3 + 1] = r * Math.sin(theta) * Math.sin(phi);
          positions[i * 3 + 2] = (Math.random() - 0.5) * 80;

          const chosenColor = colorPalette[Math.floor(Math.random() * colorPalette.length)];
          colors[i * 3] = chosenColor.r;
          colors[i * 3 + 1] = chosenColor.g;
          colors[i * 3 + 2] = chosenColor.b;
        }

        particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        particleGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const particleMat = new THREE.PointsMaterial({
          size: 0.45,
          vertexColors: true,
          transparent: true,
          opacity: 0.85,
        });

        const starField = new THREE.Points(particleGeo, particleMat);
        scene.add(starField);

        const ambientLight = new THREE.AmbientLight(0x2A1A10, 2);
        scene.add(ambientLight);

        const pointLight = new THREE.PointLight(0xFFD21F, 3, 100);
        pointLight.position.set(0, 5, 20);
        scene.add(pointLight);

        let mouseX = 0, mouseY = 0;
        const onMouseMove = (e) => {
          mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
          mouseY = -(e.clientY / window.innerHeight - 0.5) * 2;
        };
        window.addEventListener('mousemove', onMouseMove);

        let clock = new THREE.Clock();
        let animId;

        const animate = () => {
          animId = requestAnimationFrame(animate);
          const t = clock.getElapsedTime();

          portalRing.rotation.x = t * 0.25;
          portalRing.rotation.y = t * 0.35;
          innerRing.rotation.x = t * -0.4;
          innerRing.rotation.z = t * 0.5;
          starField.rotation.y = t * 0.04;

          camera.position.x += (mouseX * 5 - camera.position.x) * 0.05;
          camera.position.y += (mouseY * 5 - camera.position.y) * 0.05;
          camera.lookAt(scene.position);

          renderer.render(scene, camera);
        };
        animate();

        const onResize = () => {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        };
        window.addEventListener('resize', onResize);

        return () => {
          cancelAnimationFrame(animId);
          window.removeEventListener('mousemove', onMouseMove);
          window.removeEventListener('resize', onResize);
          if (container.contains(renderer.domElement)) {
            container.removeChild(renderer.domElement);
          }
        };
      }, []);

      const handleLaunch = () => {
        setIsEntering(true);
        setTimeout(() => {
          onEnterApp();
        }, 450);
      };

      return (
        <div className={`fixed inset-0 z-50 bg-[#080605] flex flex-col justify-between overflow-hidden transition-opacity duration-500 ${isEntering ? 'opacity-0 scale-95 pointer-events-none' : 'opacity-100'}`}>
          <div ref={mountRef} className="absolute inset-0 cursor-grab active:cursor-grabbing" />

          {/* Top Navbar */}
          <div className="relative z-10 w-full max-w-6xl mx-auto px-6 py-6 flex justify-between items-center select-none pointer-events-none">
            <div className="flex items-center gap-3">
              <img 
                src="/assets/aaruush-logo.png" 
                alt="Aaruush Logo" 
                className="w-10 h-10 object-contain drop-shadow-[0_0_12px_#FF6A00]" 
              />
              <span className="text-xs font-mono font-bold tracking-widest text-[#FFD21F] uppercase">
                CARNIVAL RESERVE 2026
              </span>
            </div>
            <div className="bg-[#140E0A]/80 backdrop-blur border border-[#FF8A1F]/40 px-3 py-1.5 rounded-full text-[10px] font-mono text-[#FF8A1F] flex items-center gap-2">
              <span className="w-2 h-2 rounded-full bg-[#35D07F] animate-ping" />
              <span>REGISTRATION PORTAL LIVE</span>
            </div>
          </div>

          {/* Central Hero Overlay */}
          <div className="relative z-10 text-center px-4 max-w-2xl mx-auto space-y-5 select-none pointer-events-none">
            <div className="relative w-28 h-28 mx-auto pulse-glow flex items-center justify-center">
              <div className="absolute inset-0 bg-gradient-to-r from-[#FF6A00] to-[#FFD21F] rounded-full blur-2xl opacity-40 animate-pulse" />
              <img 
                src="/assets/aaruush-logo.png" 
                alt="Aaruush Emblem" 
                className="w-24 h-24 object-contain relative z-10 drop-shadow-[0_0_20px_rgba(255,106,0,0.8)]" 
              />
            </div>

            <div className="space-y-2">
              <div className="text-xs font-black uppercase tracking-[0.3em] text-[#FFD21F]">
                17 OFFICIAL DOMAINS • REGISTER FOR EVENTS • COMPETE & WIN
              </div>
              <h1 className="text-4xl sm:text-6xl font-black uppercase tracking-wider text-white font-heading leading-tight drop-shadow-2xl">
                CARNIVAL <br />
                <span className="bg-gradient-to-r from-[#FF6A00] via-[#FF8A1F] to-[#FFD21F] bg-clip-text text-transparent">
                  RESERVE
                </span>
              </h1>
              <p className="text-xs sm:text-sm font-bold uppercase tracking-widest text-[#FF8A1F]">
                A NATIONAL LEVEL TECHNO-MANAGEMENT FEST
              </p>
              <p className="text-xs sm:text-sm text-[#C8C2BA] max-w-md mx-auto leading-relaxed">
                Step into the official event registration platform. Choose your domains, register your team, and receive your confirmed festival credentials.
              </p>
            </div>

            <div className="pt-2 pointer-events-auto">
              <button
                onClick={handleLaunch}
                className="group relative px-8 py-3.5 bg-gradient-to-r from-[#FF6A00] via-[#FF8A1F] to-[#FFD21F] text-black font-black text-xs uppercase tracking-widest rounded-full shadow-[0_0_35px_rgba(255,106,0,0.7)] hover:scale-105 active:scale-95 transition-all flex items-center gap-3 mx-auto"
              >
                <span>ENTER REGISTRATION PLATFORM</span>
                <span className="group-hover:translate-x-1.5 transition-transform text-base">→</span>
              </button>
            </div>
          </div>

          {/* Bottom Footer Info */}
          <div className="relative z-10 w-full max-w-6xl mx-auto px-6 py-6 flex flex-wrap justify-between items-center text-[10px] text-[#A9A29A] select-none pointer-events-none">
            <div>© 2026 Carnival Reserve • Aaruush Official</div>
            <div className="flex gap-4">
              <span>17 DOMAINS TOTAL</span>
              <span>SOLO & TEAM REGISTRATIONS</span>
              <span>SRM INSTITUTE OF SCIENCE & TECHNOLOGY</span>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // MAIN APPLICATION COMPONENT
    // =========================================================================
    function App() {
      // 3D Opening state
      const [show3dOpening, setShow3dOpening] = useState(() => {
        return localStorage.getItem('cr_entered_portal') !== 'true';
      });

      const handleEnterApp = () => {
        localStorage.setItem('cr_entered_portal', 'true');
        setShow3dOpening(false);
      };

      // Navigation: 'dashboard' | 'domains' | 'my-registrations' | 'profile'
      const [activeTab, setActiveTab] = useState('dashboard');

      // User state (persisted)
      const [user, setUser] = useState(() => {
        try {
          const saved = localStorage.getItem('cr_user');
          return saved ? JSON.parse(saved) : null;
        } catch {
          return null;
        }
      });

      // Token State
      const [token, setToken] = useState(() => {
        try {
          return localStorage.getItem('cr_token') || '';
        } catch {
          return '';
        }
      });

      // User registered domains list
      const [userRegistrations, setUserRegistrations] = useState([]);
      const [isLoadingRegs, setIsLoadingRegs] = useState(false);

      // Modals
      const [showAuthModal, setShowAuthModal] = useState(null); // 'register' | 'login' | null
      const [selectedDomainForDetails, setSelectedDomainForDetails] = useState(null);
      const [selectedDomainForReg, setSelectedDomainForReg] = useState(null);
      const [regSuccessData, setRegSuccessData] = useState(null);

      // Staff Portal State (DOMAIN_POC and MAIN_SUPERVISOR)
      const [showStaffModal, setShowStaffModal] = useState(false);
      const [staffRole, setStaffRole] = useState(null); // 'DOMAIN_POC' | 'MAIN_SUPERVISOR' | null
      const [staffLoginForm, setStaffLoginForm] = useState({ identifier: '', password: '' });
      const [staffPocData, setStaffPocData] = useState(null);
      const [staffSupervisorData, setStaffSupervisorData] = useState(null);
      const [staffLoading, setStaffLoading] = useState(false);
      const [staffError, setStaffError] = useState('');
      const [staffSearchQuery, setStaffSearchQuery] = useState('');
      const [selectedDomainRoster, setSelectedDomainRoster] = useState(null);
      const [domainRosterLoading, setDomainRosterLoading] = useState(false);

      // Points & CRN State
      const [participantPoints, setParticipantPoints] = useState({ balance: 50, totalEarned: 50, transactions: [] });
      const [pocAwardForm, setPocAwardForm] = useState({ participantId: '', amount: 100, reason: '' });
      const [pocPointHistory, setPocPointHistory] = useState([]);
      const [isAwardingPoints, setIsAwardingPoints] = useState(false);

      // Main POC Cross-Domain Points & Gateway Flow
      const [mainPocAwardForm, setMainPocAwardForm] = useState({ domainId: 'Electrizite', participantId: '', amount: 150, reason: '' });
      const [allPointHistory, setAllPointHistory] = useState([]);
      const [gatewayProcessing, setGatewayProcessing] = useState(false);
      const [gatewayReceipt, setGatewayReceipt] = useState(null);

      // Forms
      const [regForm, setRegForm] = useState({
        name: '',
        email: '',
        phone: '',
        college: 'SRM Institute of Science and Technology',
        regNo: '',
        password: '',
        confirmPassword: '',
        termsAccepted: false
      });
      const [loginForm, setLoginForm] = useState({ identifier: '', password: '' });
      const [domainRegForm, setDomainRegForm] = useState({
        participationType: 'solo',
        teamName: '',
        teamMembers: ''
      });
      const [formError, setFormError] = useState('');
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [toastMsg, setToastMsg] = useState('');

      // Search and Filter for 17 Domains
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCluster, setSelectedCluster] = useState('All');

      const triggerToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 3500);
      };

      // Fetch user's registered domains from backend
      const fetchUserRegistrations = async (userId, customToken) => {
        const activeToken = customToken || token || localStorage.getItem('cr_token');
        setIsLoadingRegs(true);
        try {
          if (activeToken) {
            const res = await fetch('/api/my-registrations', {
              headers: { 'Authorization': 'Bearer ' + activeToken }
            });
            if (res.ok) {
              const data = await res.json();
              if (data.success && Array.isArray(data.registrations)) {
                setUserRegistrations(data.registrations);
                setIsLoadingRegs(false);
                return;
              }
            }
          }
          if (userId) {
            const res2 = await fetch('/api/user/registrations?userId=' + encodeURIComponent(userId));
            const data2 = await res2.json();
            if (data2.success && Array.isArray(data2.registrations)) {
              setUserRegistrations(data2.registrations);
            }
          }
        } catch (err) {
          console.error('Failed to load user registrations:', err);
        } finally {
          setIsLoadingRegs(false);
        }
      };

      const fetchParticipantPoints = async (activeToken) => {
        const tok = activeToken || token || localStorage.getItem('cr_token');
        if (!tok) return;
        try {
          const res = await fetch('/api/participant/points', {
            headers: { 'Authorization': 'Bearer ' + tok }
          });
          if (res.ok) {
            const data = await res.json();
            if (data.success) {
              setParticipantPoints(data);
            }
          }
        } catch (e) {}
      };

      useEffect(() => {
        if (user && user.id) {
          fetchUserRegistrations(user.id, token);
          fetchParticipantPoints(token);
        } else {
          setUserRegistrations([]);
          setParticipantPoints({ balance: 0, totalEarned: 0, transactions: [] });
        }
      }, [user]);

      // Set of registered domain IDs for instant O(1) lookup
      const registeredDomainMap = useMemo(() => {
        const map = {};
        userRegistrations.forEach(r => {
          map[r.domainId] = r;
          map[r.domainName] = r;
        });
        return map;
      }, [userRegistrations]);

      // Handlers: Register Account
      const handleRegisterAccount = async (e) => {
        e.preventDefault();
        setFormError('');
        if (regForm.password !== regForm.confirmPassword) {
          setFormError('Passwords do not match.');
          return;
        }
        if (regForm.password.length < 6) {
          setFormError('Password must be at least 6 characters.');
          return;
        }
        if (!regForm.termsAccepted) {
          setFormError('Please accept the Terms and Conditions.');
          return;
        }

        setIsSubmitting(true);
        try {
          const res = await fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(regForm)
          });
          const data = await res.json();
          setIsSubmitting(false);

          if (!res.ok || data.error) {
            setFormError(data.message || data.error || 'Registration failed.');
            return;
          }

          const loggedInUser = data.user;
          const userToken = data.token || '';
          setUser(loggedInUser);
          setToken(userToken);
          localStorage.setItem('cr_user', JSON.stringify(loggedInUser));
          if (userToken) localStorage.setItem('cr_token', userToken);
          setShowAuthModal(null);
          triggerToast(`🎉 Welcome to Carnival Reserve, ${loggedInUser.name}!`);
          if (window.confetti) window.confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
          fetchUserRegistrations(loggedInUser.id, userToken);
        } catch (err) {
          setIsSubmitting(false);
          setFormError('Network error connecting to registration server.');
        }
      };

      // Handlers: Login
      const handleLogin = async (e) => {
        e.preventDefault();
        setFormError('');
        setIsSubmitting(true);

        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(loginForm)
          });
          const data = await res.json();
          setIsSubmitting(false);

          if (!res.ok || data.error) {
            setFormError(data.message || data.error || 'Login failed.');
            return;
          }

          const loggedInUser = data.user;
          const userToken = data.token || '';
          setUser(loggedInUser);
          setToken(userToken);
          localStorage.setItem('cr_user', JSON.stringify(loggedInUser));
          if (userToken) localStorage.setItem('cr_token', userToken);
          setShowAuthModal(null);
          triggerToast(`👋 Welcome back, ${loggedInUser.name}!`);
          fetchUserRegistrations(loggedInUser.id, userToken);
        } catch (err) {
          setIsSubmitting(false);
          setFormError('Network error during login.');
        }
      };

      const handleLogout = () => {
        localStorage.removeItem('cr_user');
        localStorage.removeItem('cr_token');
        setUser(null);
        setToken('');
        setUserRegistrations([]);
        setStaffRole(null);
        setStaffPocData(null);
        setStaffSupervisorData(null);
        setShowStaffModal(false);
        triggerToast('Signed out of Carnival Reserve.');
      };

      // Open Domain Registration Modal
      const openDomainRegistration = (domain) => {
        if (!user) {
          setShowAuthModal('login');
          triggerToast('Please sign in or register an account to enter domains.');
          return;
        }

        // Check duplicate
        if (registeredDomainMap[domain.id] || registeredDomainMap[domain.displayName]) {
          triggerToast(`You are already registered for ${domain.displayName}!`);
          return;
        }

        setSelectedDomainForReg(domain);
        setDomainRegForm({
          participationType: 'solo',
          teamName: '',
          teamMembers: ''
        });
        setFormError('');
      };

      // Submit Domain Registration
      const handleConfirmDomainRegistration = async (e) => {
        e.preventDefault();
        if (!user || !selectedDomainForReg) return;
        setFormError('');
        setIsSubmitting(true);

        try {
          const activeToken = token || localStorage.getItem('cr_token');
          const res = await fetch('/api/domains/register', {
            method: 'POST',
            headers: { 
              'Content-Type': 'application/json',
              ...(activeToken ? { 'Authorization': 'Bearer ' + activeToken } : {})
            },
            body: JSON.stringify({
              userId: user.id,
              domainId: selectedDomainForReg.id,
              domainName: selectedDomainForReg.displayName,
              teamName: domainRegForm.participationType === 'team' ? domainRegForm.teamName : '',
              teamMembers: domainRegForm.participationType === 'team' ? domainRegForm.teamMembers : ''
            })
          });
          const data = await res.json();
          setIsSubmitting(false);

          if (!res.ok || data.error) {
            setFormError(data.message || data.error || 'Failed to complete domain registration.');
            return;
          }

          // Registration successful!
          const regInfo = data.registration;
          fetchUserRegistrations(user.id, activeToken);
          setSelectedDomainForReg(null);
          setSelectedDomainForDetails(null);
          setRegSuccessData({
            ...regInfo,
            domainLogo: selectedDomainForReg.logo,
            domainTagline: selectedDomainForReg.tagline,
            domainSchedule: selectedDomainForReg.schedule,
            domainVenue: selectedDomainForReg.venue
          });

          if (window.confetti) {
            window.confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
          }
        } catch (err) {
          setIsSubmitting(false);
          setFormError('Network error registering for domain.');
        }
      };

      // Staff Portal Operations
      const openStaffPortal = () => {
        setShowStaffModal(true);
        setStaffError('');
        const activeToken = token || localStorage.getItem('cr_token');
        if (user && (user.role === 'DOMAIN_POC' || user.role === 'MAIN_POC' || user.role === 'MAIN_SUPERVISOR')) {
          setStaffRole(user.role === 'DOMAIN_POC' ? 'DOMAIN_POC' : 'MAIN_POC');
          loadStaffDashboard(user.role, activeToken);
        } else {
          setStaffRole(null);
        }
      };

      const loadStaffDashboard = async (role, activeToken) => {
        setStaffLoading(true);
        setStaffError('');
        try {
          if (role === 'DOMAIN_POC') {
            const res = await fetch('/api/poc/registrations', {
              headers: { 'Authorization': 'Bearer ' + activeToken }
            });
            const data = await res.json();
            if (res.ok && data.success) {
              setStaffPocData(data);
              setStaffRole('DOMAIN_POC');
            } else {
              setStaffError(data.message || 'Failed to load POC domain registrations.');
            }
            fetchPocPointHistory(activeToken);
          } else if (role === 'MAIN_SUPERVISOR' || role === 'MAIN_POC') {
            const res = await fetch('/api/supervisor/overview', {
              headers: { 'Authorization': 'Bearer ' + activeToken }
            });
            const data = await res.json();
            if (res.ok && data.success) {
              setStaffSupervisorData(data);
              setStaffRole('MAIN_POC');
            } else {
              setStaffError(data.message || 'Failed to load supervisor overview.');
            }
            fetchAllPointHistory(activeToken);
          }
        } catch (err) {
          setStaffError('Network error connecting to staff portal.');
        } finally {
          setStaffLoading(false);
        }
      };

      const fetchPocPointHistory = async (activeToken) => {
        const tok = activeToken || token || localStorage.getItem('cr_token');
        try {
          const res = await fetch('/api/poc/points/history', {
            headers: { 'Authorization': 'Bearer ' + tok }
          });
          const data = await res.json();
          if (res.ok && data.success) {
            setPocPointHistory(data.transactions || []);
          }
        } catch (e) {}
      };

      const handlePocAwardPoints = async (e) => {
        e.preventDefault();
        if (!pocAwardForm.participantId) {
          triggerToast('Please select or enter a participant identifier.');
          return;
        }
        setIsAwardingPoints(true);
        const activeToken = token || localStorage.getItem('cr_token');
        try {
          const res = await fetch('/api/poc/points/award', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + activeToken
            },
            body: JSON.stringify({
              participantId: pocAwardForm.participantId,
              domainId: user.assignedDomainId,
              amount: parseInt(pocAwardForm.amount, 10) || 50,
              reason: pocAwardForm.reason || 'Domain challenge points'
            })
          });
          const data = await res.json();
          setIsAwardingPoints(false);
          if (res.ok && data.success) {
            triggerToast(`🪙 ${data.message || 'Points awarded successfully!'}`);
            setPocAwardForm({ participantId: '', amount: 100, reason: '' });
            fetchPocPointHistory(activeToken);
            if (window.confetti) window.confetti({ particleCount: 80, spread: 60 });
          } else {
            triggerToast(data.message || data.error || 'Failed to award points.');
          }
        } catch (e) {
          setIsAwardingPoints(false);
          triggerToast('Network error awarding points.');
        }
      };

      const fetchAllPointHistory = async (activeToken) => {
        const tok = activeToken || token || localStorage.getItem('cr_token');
        try {
          const res = await fetch('/api/main-poc/points/history', {
            headers: { 'Authorization': 'Bearer ' + tok }
          });
          const data = await res.json();
          if (res.ok && data.success) {
            setAllPointHistory(data.transactions || []);
          }
        } catch (e) {}
      };

      const handleMainPocAwardPoints = async (e) => {
        e.preventDefault();
        if (!mainPocAwardForm.participantId) {
          triggerToast('Please enter or select a participant ID.');
          return;
        }
        setGatewayProcessing(true);
        const activeToken = token || localStorage.getItem('cr_token');
        const gwRef = 'GW-CRN-' + Math.random().toString(36).substring(2, 9).toUpperCase();
        try {
          const res = await fetch('/api/main-poc/points/award', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + activeToken
            },
            body: JSON.stringify({
              participantId: mainPocAwardForm.participantId,
              domainId: mainPocAwardForm.domainId,
              domainName: mainPocAwardForm.domainId,
              amount: parseInt(mainPocAwardForm.amount, 10) || 100,
              reason: mainPocAwardForm.reason || 'Central fest recognition',
              gatewayReference: gwRef
            })
          });
          const data = await res.json();
          setGatewayProcessing(false);
          if (res.ok && data.success) {
            setGatewayReceipt(data.transaction);
            triggerToast(`✓ Points awarded via gateway: ${gwRef}`);
            setMainPocAwardForm({ ...mainPocAwardForm, participantId: '', reason: '' });
            fetchAllPointHistory(activeToken);
            if (window.confetti) window.confetti({ particleCount: 100, spread: 70 });
          } else {
            triggerToast(data.message || data.error || 'Failed to award points.');
          }
        } catch (e) {
          setGatewayProcessing(false);
          triggerToast('Network error in points gateway flow.');
        }
      };

      const handleStaffLogin = async (e) => {
        e.preventDefault();
        setStaffLoading(true);
        setStaffError('');
        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(staffLoginForm)
          });
          const data = await res.json();
          setStaffLoading(false);

          if (!res.ok || data.error) {
            setStaffError(data.message || data.error || 'Invalid credentials.');
            return;
          }

          if (data.user.role === 'PARTICIPANT') {
            setStaffError('Access Denied (403 Forbidden): Participant accounts cannot access the staff portal. Staff credentials required.');
            return;
          }

          setToken(data.token);
          setUser(data.user);
          localStorage.setItem('cr_token', data.token);
          localStorage.setItem('cr_user', JSON.stringify(data.user));
          setStaffRole(data.user.role);
          triggerToast(`Welcome Staff: ${data.user.name} (${data.user.role})`);
          loadStaffDashboard(data.user.role, data.token);
        } catch (err) {
          setStaffLoading(false);
          setStaffError('Network error during staff authentication.');
        }
      };

      const openSupervisorDomainRoster = async (domainId) => {
        setDomainRosterLoading(true);
        setSelectedDomainRoster({ domainId, registrations: [] });
        try {
          const activeToken = token || localStorage.getItem('cr_token');
          const res = await fetch('/api/supervisor/domain-registrations?domainId=' + encodeURIComponent(domainId), {
            headers: { 'Authorization': 'Bearer ' + activeToken }
          });
          const data = await res.json();
          if (res.ok && data.success) {
            setSelectedDomainRoster(data);
          } else {
            triggerToast(data.message || 'Failed to fetch domain roster.');
          }
        } catch (err) {
          triggerToast('Network error fetching domain roster.');
        } finally {
          setDomainRosterLoading(false);
        }
      };

      const exportCsv = (filename, rows) => {
        if (!rows || !rows.length) {
          triggerToast('No records to export.');
          return;
        }
        const headers = Object.keys(rows[0]);
        const csvContent = "data:text/csv;charset=utf-8," 
          + [headers.join(','), ...rows.map(row => headers.map(h => `"${String(row[h] || '').replace(/"/g, '""')}"`).join(','))].join('\n');
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", filename);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        triggerToast(`Exported ${rows.length} rows to ${filename}`);
      };

      // Filtered Domains
      const filteredDomains = useMemo(() => {
        return OFFICIAL_17_DOMAINS.filter(d => {
          const matchesQuery = d.displayName.toLowerCase().includes(searchQuery.toLowerCase()) ||
                               d.category.toLowerCase().includes(searchQuery.toLowerCase()) ||
                               d.tagline.toLowerCase().includes(searchQuery.toLowerCase());
          const matchesCluster = selectedCluster === 'All' || d.cluster === selectedCluster;
          return matchesQuery && matchesCluster;
        });
      }, [searchQuery, selectedCluster]);

      return (

                            </div>
                            <div className="text-[11px] text-[#C8C2BA] mt-1">
                              Awarded <strong className="text-[#FFD21F] font-mono">+{gatewayReceipt.amount} CRN</strong> for <strong>{gatewayReceipt.domainName}</strong> to participant <span className="font-mono text-white">{gatewayReceipt.participantId}</span>.
                            </div>
                          </div>
                          <div className="text-right">
                            <div className="text-[10px] text-[#A9A29A] uppercase font-mono font-bold">Gateway Reference</div>
                            <div className="font-mono font-black text-[#FFD21F] text-xs bg-[#120F0D] px-2.5 py-1 rounded-lg border border-[#FFD21F]/40 mt-0.5">
                              {gatewayReceipt.gatewayReference}
                            </div>
                          </div>
                        </div>
                      )}

                      {/* Cross Domain Award Form */}
                      <form onSubmit={handleMainPocAwardPoints} className="grid grid-cols-1 sm:grid-cols-4 gap-3 text-xs">
                        <div>
                          <label className="block text-[#A9A29A] font-bold uppercase text-[10px] mb-1">Select Domain</label>
                          <select
                            value={mainPocAwardForm.domainId}
                            onChange={e => setMainPocAwardForm({...mainPocAwardForm, domainId: e.target.value})}
                            className="w-full bg-[#1C140C] border border-[#2A1A10] focus:border-[#FFD21F] rounded-xl px-3 py-2 text-white outline-none font-bold"
                          >
                            {OFFICIAL_17_DOMAINS.map(d => (
                              <option key={d.id} value={d.displayName}>{d.displayName}</option>
                            ))}
                          </select>
                        </div>

                        <div>
                          <label className="block text-[#A9A29A] font-bold uppercase text-[10px] mb-1">Participant ID / Identifier</label>
                          <input
                            type="text"
                            required
                            placeholder="e.g. CR-XXXX or email/phone"
                            value={mainPocAwardForm.participantId}
                            onChange={e => setMainPocAwardForm({...mainPocAwardForm, participantId: e.target.value})}
                            className="w-full bg-[#1C140C] border border-[#2A1A10] focus:border-[#FFD21F] rounded-xl px-3 py-2 text-white outline-none font-mono"
                          />
                        </div>

                        <div>
                          <label className="block text-[#A9A29A] font-bold uppercase text-[10px] mb-1">Crowns (CRN)</label>
                          <div className="flex gap-1.5 items-center">
                            <input
                              type="number"
                              min="10"
                              max="1000"
                              required
                              value={mainPocAwardForm.amount}
                              onChange={e => setMainPocAwardForm({...mainPocAwardForm, amount: e.target.value})}
                              className="w-full bg-[#1C140C] border border-[#2A1A10] focus:border-[#FFD21F] rounded-xl px-3 py-2 text-white outline-none font-mono font-bold text-[#FFD21F]"
                            />
                            <div className="flex gap-1">
                              {[100, 200, 300].map(amt => (
                                <button
                                  key={amt}
                                  type="button"
                                  onClick={() => setMainPocAwardForm({...mainPocAwardForm, amount: amt})}
                                  className={`px-2 py-1.5 rounded-lg text-[10px] font-bold border transition-colors ${Number(mainPocAwardForm.amount) === amt ? 'bg-[#FFD21F] text-black border-[#FFD21F]' : 'bg-[#1C140C] text-[#A9A29A] border-[#2A1A10]'}`}
                                >
                                  {amt}
                                </button>
                              ))}
                            </div>
                          </div>
                        </div>

                        <div className="flex items-end">
                          <button
                            type="submit"
                            disabled={gatewayProcessing}
                            className="w-full py-2.5 bg-gradient-to-r from-[#FF6A00] to-[#FFD21F] text-black font-black text-xs uppercase rounded-xl shadow-lg hover:brightness-110 active:scale-[0.99] transition-all flex items-center justify-center gap-1.5"
                          >
                            <span>⚡</span>
                            <span>{gatewayProcessing ? 'Processing Gateway...' : 'Execute Gateway Award →'}</span>
                          </button>
                        </div>
                      </form>

                      {/* All Fest Point Transactions Audit Ledger */}
                      <div className="space-y-2 pt-2 border-t border-[#2A1A10]">
                        <div className="flex justify-between items-center">
                          <h5 className="font-bold text-[#FFD21F] uppercase text-[10px] tracking-wider font-mono">
                            Festival-Wide Points Audit Ledger ({allPointHistory.length} Recorded Transactions)
                          </h5>
                          <button
                            onClick={() => exportCsv('festival_point_transactions.csv', allPointHistory)}
                            className="px-2.5 py-1 bg-[#1C140C] hover:bg-[#2A1A10] border border-[#2A1A10] text-[10px] font-bold rounded-lg text-[#A9A29A] hover:text-white"
                          >
                            Export Ledger CSV
                          </button>
                        </div>

                        <div className="overflow-x-auto border border-[#2A1A10] rounded-xl bg-[#0D0907]">
                          <table className="w-full text-left text-[11px]">
                            <thead className="bg-[#16110D] border-b border-[#2A1A10] text-[#A9A29A] font-mono uppercase text-[9px]">
                              <tr>
                                <th className="p-2.5">Tx ID</th>
                                <th className="p-2.5">Domain</th>
                                <th className="p-2.5">Participant</th>
                                <th className="p-2.5">Awarded By</th>
                                <th className="p-2.5">Amount</th>
                                <th className="p-2.5">Gateway Ref</th>
                                <th className="p-2.5">Status</th>
                                <th className="p-2.5">Timestamp</th>
                              </tr>
                            </thead>
                            <tbody className="divide-y divide-[#2A1A10]">
                              {allPointHistory.map((pt, idx) => (
                                <tr key={idx} className="hover:bg-[#16110D]/60 transition-colors">
                                  <td className="p-2.5 font-mono text-[#FFD21F] font-bold">{pt.id}</td>
                                  <td className="p-2.5 font-bold text-white">{pt.domain_name || pt.domainId}</td>
                                  <td className="p-2.5 font-bold text-[#C8C2BA]">
                                    <div>{pt.participant_name || pt.participant_id}</div>
                                    <div className="text-[9px] text-[#A9A29A] font-mono">{pt.participant_id}</div>
                                  </td>
                                  <td className="p-2.5 font-mono text-[#A9A29A] text-[10px]">{pt.awarded_by} ({pt.awarded_by_role})</td>
                                  <td className="p-2.5 font-mono font-black text-[#35D07F]">+{pt.amount} CRN</td>
                                  <td className="p-2.5 font-mono text-[10px] text-[#FF8A1F]">{pt.gateway_reference || 'N/A'}</td>
                                  <td className="p-2.5 font-mono font-bold text-[#35D07F]">
                                    <span className="bg-[#35D07F]/20 px-2 py-0.5 rounded-full border border-[#35D07F]/30">{pt.status || 'SUCCESS'}</span>
                                  </td>
                                  <td className="p-2.5 text-[#A9A29A]">{new Date(pt.created_at).toLocaleDateString()}</td>
                                </tr>
                              ))}
                              {allPointHistory.length === 0 && (
                                <tr>
                                  <td colSpan="8" className="p-6 text-center text-[#A9A29A]">
                                    No points transactions recorded yet. Use the gateway console above to award points.
                                  </td>
                                </tr>
                              )}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    </div>

                    {/* Domain Roster Inspection Modal */}
                    {selectedDomainRoster && (
                      <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                        <div className="bg-[#120F0D] border-2 border-[#FFD21F] rounded-3xl p-6 max-w-4xl w-full space-y-4 shadow-2xl modal-animate max-h-[85vh] overflow-y-auto no-scrollbar">
                          <div className="flex justify-between items-start border-b border-[#2A1A10] pb-3">
                            <div>
                              <span className="text-[10px] font-mono uppercase text-[#FFD21F] font-bold">DOMAIN PARTICIPANT ROSTER</span>
                              <h3 className="text-xl font-black text-white font-heading uppercase">{selectedDomainRoster.domainId}</h3>
                              <p className="text-xs text-[#A9A29A]">{selectedDomainRoster.totalRegistrations || selectedDomainRoster.registrations?.length || 0} Registered Participants</p>
                            </div>
                            <div className="flex items-center gap-2">
                              <button
                                onClick={() => exportCsv(`${selectedDomainRoster.domainId}_roster.csv`, selectedDomainRoster.registrations || [])}
                                className="px-3 py-1.5 bg-[#FFD21F]/20 border border-[#FFD21F]/40 text-[#FFD21F] text-xs font-bold rounded-xl"
                              >
                                Export CSV
                              </button>
                              <button
                                onClick={() => setSelectedDomainRoster(null)}
                                className="w-7 h-7 rounded-full bg-[#1C140C] hover:bg-[#2A1A10] text-[#A9A29A] hover:text-white flex items-center justify-center text-xs font-bold"
                              >
                                ✕
                              </button>
                            </div>
                          </div>

                          {domainRosterLoading ? (
                            <div className="p-8 text-center text-[#A9A29A]">Loading roster data...</div>
                          ) : (
                            <div className="overflow-x-auto border border-[#2A1A10] rounded-xl">
                              <table className="w-full text-left text-[11px]">
                                <thead className="bg-[#16110D] border-b border-[#2A1A10] text-[#A9A29A] font-mono uppercase text-[9px]">
                                  <tr>
                                    <th className="p-2.5">Ticket</th>
                                    <th className="p-2.5">Participant</th>
                                    <th className="p-2.5">College</th>
                                    <th className="p-2.5">Reg No</th>
                                    <th className="p-2.5">Phone</th>
                                    <th className="p-2.5">Team</th>
                                    <th className="p-2.5">Date</th>
                                  </tr>
                                </thead>
                                <tbody className="divide-y divide-[#2A1A10]">
                                  {(selectedDomainRoster.registrations || []).map((r, idx) => (
                                    <tr key={idx} className="hover:bg-[#16110D]/50">
                                      <td className="p-2.5 font-mono text-[#FFD21F] font-bold">{r.registrationId}</td>
                                      <td className="p-2.5 font-bold text-white">
                                        <div>{r.participantName || r.participant_name}</div>
                                        <div className="text-[10px] text-[#A9A29A] font-normal">{r.participantEmail || r.participant_email}</div>
                                      </td>
                                      <td className="p-2.5 text-[#C8C2BA]">{r.participantCollege || r.participant_college}</td>
                                      <td className="p-2.5 font-mono text-[#A9A29A]">{r.participantRegNo || r.participant_reg_no}</td>
                                      <td className="p-2.5 font-mono text-[#A9A29A]">{r.participantPhone || r.participant_phone}</td>
                                      <td className="p-2.5 text-[#FF8A1F]">{r.teamName || 'Solo'}</td>
                                      <td className="p-2.5 text-[#A9A29A]">{new Date(r.registeredAt).toLocaleDateString()}</td>
                                    </tr>
                                  ))}
                                  {(!selectedDomainRoster.registrations || selectedDomainRoster.registrations.length === 0) && (
                                    <tr>
                                      <td colSpan="7" className="p-6 text-center text-[#A9A29A]">
                                        No participants registered for this domain yet.
                                      </td>
                                    </tr>
                                  )}
                                </tbody>
                              </table>
                            </div>
                          )}
                        </div>
                      </div>
                    )}
                  </div>
                )}

              </div>
            </div>
          )}

          {/* ========================================================================= */}
          {/* FOOTER */}
          {/* ========================================================================= */}
          <footer className="border-t border-[#2A1A10] bg-[#0A0705] py-8 px-4 sm:px-8 mt-12 text-xs text-[#A9A29A]">
            <div className="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
              <div className="flex items-center gap-3">
                <img 
                  src="/assets/aaruush-logo.png" 
                  alt="Aaruush Logo" 
                  className="w-7 h-7 object-contain opacity-80" 
                />
                <span className="font-heading font-black uppercase text-white tracking-wider">
                  CARNIVAL RESERVE • AARUUSH 2026
                </span>
              </div>
              <div className="flex flex-wrap items-center gap-4 sm:gap-6">
                <button onClick={() => setActiveTab('dashboard')} className="hover:text-white transition-colors">Home</button>
                <button onClick={() => setActiveTab('domains')} className="hover:text-white transition-colors">17 Domains</button>
                <button onClick={() => setActiveTab('my-registrations')} className="hover:text-white transition-colors">My Registrations</button>
                <button onClick={() => setActiveTab('profile')} className="hover:text-white transition-colors">Profile</button>
                <span className="text-[#2A1A10] hidden sm:inline">|</span>
                <button onClick={openStaffPortal} className="text-[#A9A29A] hover:text-[#FF8A1F] transition-colors underline font-medium text-[11px]">Staff Portal (POC / Supervisor)</button>
              </div>
              <div>
                © 2026 SRMIST • All Rights Reserved
              </div>
            </div>
          </footer>
        </div>
      );
    }

    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error("ErrorBoundary caught:", error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen bg-[#080605] flex items-center justify-center p-6 text-center text-white">
              <div className="max-w-md p-8 rounded-3xl bg-[#120F0D] border border-[#FF6A00]/40 space-y-4 shadow-2xl">
                <div className="w-12 h-12 mx-auto rounded-full bg-[#FF6A00]/20 flex items-center justify-center text-xl text-[#FF6A00]">
                  ⚠️
                </div>
                <h2 className="text-xl font-black font-heading text-[#FFD21F]">Carnival Reserve</h2>
                <p className="text-xs text-[#A9A29A]">An unexpected issue occurred. Click reload to refresh the portal.</p>
                <button onClick={() => window.location.reload()} className="px-6 py-2.5 rounded-full bg-gradient-to-r from-[#FF6A00] to-[#FFD21F] text-black font-black text-xs uppercase tracking-wider">
                  Reload Portal
                </button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
